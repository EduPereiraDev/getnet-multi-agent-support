[project]
name = "getnet-multi-agent-support"
version = "0.1.0"
description = "Multi-agent support system (Router, Knowledge/RAG, Customer Support, Human Escalation) for Getnet merchants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    "anthropic>=2.0,<3",
    "ddgs>=9.0,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: tests that call the real LLM (need ANTHROPIC_API_KEY)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 110
target-version = "py311"

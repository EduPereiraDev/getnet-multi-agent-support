[project]
name = "getnet-multi-agent-support"
version = "0.1.0"
description = "Multi-agent support system (Router, Knowledge/RAG, Customer Support, Human Escalation) for Getnet merchants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "anthropic>=0.60",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: tests that call the real LLM (need ANTHROPIC_API_KEY)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 110
target-version = "py311"
